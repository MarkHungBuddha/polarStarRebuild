<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<title>北極星連結預覽圖來源</title>
<style>
  /* Fixed light-theme palette from src/techo.css. No remote resources. */
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; padding: 52px 64px; background: #f6f1e7; background-image: radial-gradient(#ddd3c2 1px, transparent 1px); background-size: 20px 20px; color: #2b2a27; font-family: 'Microsoft JhengHei', sans-serif; }
  article { position: relative; display: flex; flex-direction: column; justify-content: center; height: 526px; padding: 42px 60px; background: #fffdf8; border: 1px solid #ddd3c2; border-radius: 6px; box-shadow: 0 8px 20px #3c280a14; }
  article::before { content: ''; position: absolute; top: -15px; right: 66px; width: 170px; height: 34px; background: #edbcaf; opacity: .85; transform: rotate(3deg); }
  header { display: flex; align-items: center; gap: 16px; color: #2f4a6d; font-size: 32px; font-weight: 700; }
  svg { width: 40px; height: 40px; }
  h1 { margin: 30px 0 0; font-size: 76px; line-height: 1.3; letter-spacing: 2px; font-weight: 700; }
  mark { background: linear-gradient(transparent 65%, #edbcaf 65%, #edbcaf 91%, transparent 91%); color: inherit; }
</style>
<article>
  <header><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 24 16 38 20 24 24 20 38 16 24 2 20 16 16Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>北極星</header>
  <h1>你重視什麼，<br><mark>會怎麼選？</mark></h1>
</article>
</html>
